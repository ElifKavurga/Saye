spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5432/saye_db
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.spatial.dialect.postgis.PostgisPG95Dialect
  sql:
    init:
      mode: always

app:
  security:
    demo-login-enabled: true
    jwt-secret: "saye-development-jwt-secret-key-change-me-2026"
    access-token-ttl: 15m
    refresh-token-ttl: 30d
