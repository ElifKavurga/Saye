spring:
  application:
    name: backend
  datasource:
    # default to in-memory H2 for ease of local development
    url: jdbc:h2:mem:backenddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: update

app:
  security:
    demo-login-enabled: true
