spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5432/saye_db
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: ${POSTGRES_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.spatial.dialect.postgis.PostgisPG95Dialect
        show_sql: true
        format_sql: true
  sql:
    init:
      mode: always

app:
  security:
    demo-login-enabled: false
    jwt-secret: ${APP_JWT_SECRET:saye-development-jwt-secret-key-change-me-2026}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
  encryption:
    aes-secret-key: ${APP_AES_SECRET_KEY:my_super_secret_key_32_chars_long}
    email-lookup-hmac-secret: ${APP_EMAIL_LOOKUP_HMAC_SECRET:saye-email-lookup-hmac-secret-change-me-2026}

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  phone-number: ${TWILIO_PHONE_NUMBER:}
